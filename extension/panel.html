<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>题库网关面板</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #e8e8e8; background: #1b1b1b; }
  header { padding: 10px 12px; background: #252525; border-bottom: 1px solid #3a3a3a; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex: none; }
  .dot.on { background: #3ec46d; }
  .dot.off { background: #e0533d; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; font-size: 12px; padding: 5px 10px; border: 1px solid #4a4a4a; border-radius: 6px; background: #333; color: #e8e8e8; cursor: pointer; }
  button:hover { background: #3d3d3d; }
  button.primary { background: #2f6feb; border-color: #2f6feb; color: #fff; }
  button.primary:hover { background: #3b7bf5; }
  button.on { background: #2f6feb; border-color: #2f6feb; color: #fff; }
  #status { font-size: 12px; color: #9a9a9a; margin-top: 8px; }
  #status.err { color: #e8933d; }
  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
  .tabs button { flex: 1; }
  iframe { width: 100%; height: calc(100vh - 128px); border: 0; background: #1b1b1b; display: block; }
  .gate { padding: 24px 16px; text-align: center; color: #9a9a9a; }
  .gate code { background: #2a2a2a; padding: 2px 6px; border-radius: 4px; color: #d7ba7d; }
  label.chk { font-size: 12px; color: #9a9a9a; display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>题库网关面板</h1>
  <div class="row">
    <button id="reload" title="重新探测网关">刷新</button>
    <button id="full" class="primary" title="在新标签打开完整管理页">完整页 ↗</button>
    <label class="chk"><input type="checkbox" id="autotab" /> 启动时自动开标签</label>
  </div>
  <div id="status">探测网关中…</div>
</header>
<div class="tabs" id="tabs" style="display:none">
  <button data-p="/" class="on">总览</button>
  <button data-p="/export">导出</button>
  <button data-p="/import">导入</button>
  <button data-p="/review">复核</button>
  <button data-p="/sources">票源</button>
</div>
<iframe id="frame" style="display:none"></iframe>
<div class="gate" id="gate" style="display:none">
  <p>网关未运行</p>
  <p>先双击 <code>start.cmd</code> 启动网关，再点「刷新」。</p>
  <p style="font-size:12px">脚本会依次探测 8321–8325 端口（占用时网关自动 +1）。</p>
</div>

<script src="panel.js"></script>
</body>
</html>
